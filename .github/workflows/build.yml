name: Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"

      - name: Restore
        run: dotnet restore CyberEngine.csproj

      - name: Build
        run: dotnet build CyberEngine.csproj --configuration Release --no-restore
